name: Docker Image CI

on:
  push:
    branches: [ "main" ]  # Mantenemos "principal" que es tu rama real
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar tu repositorio
    - uses: actions/checkout@v4
    
    # 2. Iniciar sesión en Docker Hub usando tus secretos exactos
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Compilar y subir la imagen actualizada
    - name: Build and push Docker images
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          98333/api-devops:latest
          98333/api-devops:${{ github.sha }}

    # 4. Conectarse de forma segura a Microsoft Azure
    - name: Iniciar sesión en Microsoft Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 5. Forzar a Azure a descargar la nueva imagen y reiniciar el contenedor
    - name: Desplegar en Azure Container Instances
      uses: azure/aci-deploy@v1
      with:
        resource-group: ProyectoDevopsRG2
        dns-name-label: api-devops-gustavo
        image: 98333/api-devops:latest
        name: api-devops-container
        ports: 3000
        location: centralus
